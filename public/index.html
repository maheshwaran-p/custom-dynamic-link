<!DOCTYPE html>
<html lang="en">
<head>
    <!-- test 1 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroupKart - Shop Together</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-android {
            background: #3DDC84;
            color: white;
        }
        
        .btn-ios {
            background: #000;
            color: white;
        }
        
        .btn-clear {
            background: #ff4444;
            color: white;
            font-size: 12px;
            padding: 8px 16px;
        }
        
        .info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            color: #555;
            font-size: 14px;
        }
        
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .status-info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .debug {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            font-size: 12px;
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            display: block; /* Always show in debug mode */
        }
        
        .debug-item {
            margin: 5px 0;
            padding: 5px;
            background: white;
            border-radius: 4px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛒</div>
        <h1>Welcome to GroupKart!</h1>
        <p id="mainText">Shop together effortlessly and get exclusive deals.</p>
        
        <div id="status"></div>
        
        <div class="buttons">
            <button id="androidBtn" class="btn btn-android">
                📱 Open in App / Download for Android
            </button>
            <button id="iosBtn" class="btn btn-ios">
                🍎 Open in App / Download for iOS
            </button>
            <button id="clearBtn" class="btn btn-clear" style="display: none;">
                🔄 Clear Session & Retry
            </button>
        </div>
        
        <div class="info">
            <div class="info-item">✓ Fresh Indian sweets & snacks</div>
            <div class="info-item">✓ Delivered in 5-7 working days</div>
            <div class="info-item">✓ Shop together & save more</div>
        </div>
        
        <div id="debug" class="debug">
            <div style="font-weight: bold; margin-bottom: 10px;">🔍 Debug Information</div>
            <div id="debugContent"></div>
        </div>
    </div>

    <script>
        // ====== CONFIGURATION ======
        const DEBUG = true; // Always debug mode
        
        const CONFIG = {
            androidPackage: 'com.groupkart.store',
            iosAppId: '6444329023',
            playStoreUrl: 'https://play.google.com/store/apps/details?id=com.groupkart.store',
            appStoreUrl: 'https://apps.apple.com/us/app/groupkart/id6444329023',
            appOpenTimeout: 2500,
        };

        let redirectAttempted = false;
        let appOpened = false;
        const sessionKey = 'groupkart_redirect_attempted_v2'; // New version key

        // ====== DEBUG LOGGER ======
        function debugLog(message, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            console.log(`[${timestamp}] ${message}`, data || '');
            
            const debugContent = document.getElementById('debugContent');
            const logItem = document.createElement('div');
            logItem.className = 'debug-item';
            
            let dataStr = '';
            if (data !== null && data !== undefined) {
                if (typeof data === 'object') {
                    dataStr = '<br><pre style="margin:5px 0;font-size:11px;">' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    dataStr = ' → ' + data;
                }
            }
            
            logItem.innerHTML = `<strong>[${timestamp}]</strong> ${message}${dataStr}`;
            debugContent.appendChild(logItem);
            debugContent.scrollTop = debugContent.scrollHeight;
        }

        function setStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status-${type}`;
        }

        // ====== CHECK SESSION STORAGE ======
        const hasAttempted = sessionStorage.getItem(sessionKey);
        if (hasAttempted === 'true') {
            debugLog('⚠️ Previous redirect detected in session');
            redirectAttempted = true;
            document.getElementById('clearBtn').style.display = 'block';
            setStatus('⚠️ Previous redirect detected. Click "Clear Session" to retry', 'error');
        }

        // ====== CLEAR SESSION BUTTON ======
        document.getElementById('clearBtn').addEventListener('click', () => {
            sessionStorage.clear();
            debugLog('🔄 Session cleared, reloading page...');
            location.reload();
        });

        // ====== PLATFORM DETECTION ======
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isMobile = isAndroid || isIOS;

        debugLog('🔍 Platform Detection', {
            userAgent: userAgent.substring(0, 150),
            isAndroid: isAndroid,
            isIOS: isIOS,
            isMobile: isMobile,
            windowWidth: window.innerWidth,
            touchSupport: 'ontouchstart' in window
        });

        // ====== EXTRACT DEEP LINK DATA ======
        const urlParams = new URLSearchParams(window.location.search);
        const pathParts = window.location.pathname.split('/').filter(p => p);
        
        const deepLinkData = {
            type: pathParts[0] || 'home',
            cartId: urlParams.get('cart_id'),
            invitedUserId: urlParams.get('invited_user_id'),
            ownerName: urlParams.get('Owner_name'),
            productId: urlParams.get('id'),
            referCode: urlParams.get('refer') || (pathParts[0] === 'refer' ? pathParts[1] : null),
            index: urlParams.get('index') || '0',
            secPos: urlParams.get('secPos') || '0',
            list: urlParams.get('list') || 'false',
        };

        debugLog('📋 Deep Link Data', deepLinkData);
        debugLog('🌐 Full URL', window.location.href);

        // ====== SAVE TO LOCALSTORAGE ======
        function saveDeepLinkData() {
            if (deepLinkData.cartId || deepLinkData.productId || deepLinkData.referCode) {
                const dataToSave = {
                    ...deepLinkData,
                    timestamp: Date.now(),
                    url: window.location.href,
                };
                
                try {
                    localStorage.setItem('groupkart_pending_deeplink', JSON.stringify(dataToSave));
                    debugLog('💾 Saved to localStorage', dataToSave);
                    return true;
                } catch (e) {
                    debugLog('❌ LocalStorage error', e.message);
                    return false;
                }
            }
            debugLog('⏭️ No deep link data to save');
            return false;
        }

        const dataSaved = saveDeepLinkData();

        // ====== UPDATE UI ======
        function updateUI() {
            const mainText = document.getElementById('mainText');
            
            if (deepLinkData.cartId) {
                mainText.innerHTML = `<strong>${deepLinkData.ownerName || 'A friend'}</strong> invited you to join their shopping cart!<br><br><small>Cart ID: ${deepLinkData.cartId}</small>`;
                setStatus('📧 Cart invitation detected', 'success');
            } else if (deepLinkData.productId) {
                mainText.innerHTML = `Check out this awesome product!<br><br><small>Product ID: ${deepLinkData.productId}</small>`;
                setStatus('🎁 Product link detected', 'success');
            } else if (deepLinkData.referCode) {
                mainText.innerHTML = `You've been invited to join GroupKart!<br><br><strong>Referral Code: ${deepLinkData.referCode}</strong>`;
                setStatus('🎉 Referral invitation detected', 'success');
            }
        }

        // ====== BUILD CUSTOM SCHEME URI ======
        function buildCustomSchemeUri() {
            let path = '';
            const params = [];
            
            if (deepLinkData.cartId) {
                path = 'cart';
                params.push(`cart_id=${deepLinkData.cartId}`);
                params.push(`invited_user_id=${deepLinkData.invitedUserId || ''}`);
                params.push(`Owner_name=${encodeURIComponent(deepLinkData.ownerName || '')}`);
            } else if (deepLinkData.productId) {
                path = 'product';
                params.push(`id=${deepLinkData.productId}`);
                params.push(`index=${deepLinkData.index}`);
                params.push(`secPos=${deepLinkData.secPos}`);
                params.push(`list=${deepLinkData.list}`);
            } else if (deepLinkData.referCode) {
                path = 'refer';
                params.push(`code=${deepLinkData.referCode}`);
            }
            
            const queryString = params.length > 0 ? '?' + params.join('&') : '';
            const fullUri = `groupkart://${path}${queryString}`;
            
            debugLog('🔗 Built custom scheme URI', fullUri);
            return fullUri;
        }

        // ====== DETECT IF APP OPENED ======
        function setupAppOpenDetection() {
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    appOpened = true;
                    debugLog('✅ App opened (visibilitychange → hidden)');
                    setStatus('✅ Opening GroupKart app...', 'success');
                }
            });
            
            window.addEventListener('blur', () => {
                appOpened = true;
                debugLog('✅ App opened (window blur)');
            });
            
            window.addEventListener('pagehide', () => {
                appOpened = true;
                debugLog('✅ App opened (pagehide)');
            });
        }

        // ====== TRY TO OPEN APP (ANDROID) ======
        function tryOpenAndroidApp() {
            if (redirectAttempted) {
                debugLog('⚠️ Android: Redirect already attempted');
                return;
            }
            
            redirectAttempted = true;
            sessionStorage.setItem(sessionKey, 'true');
            appOpened = false;
            
            debugLog('🤖 Android: Starting app open attempt');
            setStatus('🔄 Attempting to open app...', 'info');
            
            const customScheme = buildCustomSchemeUri();
            const startTime = Date.now();
            
            // Try to open app
            window.location.href = customScheme;
            
            // Wait and check if app opened
            setTimeout(() => {
                const elapsed = Date.now() - startTime;
                debugLog('⏱️ Android: Wait complete', `${elapsed}ms`);
                debugLog('📊 Android: App opened?', appOpened);
                debugLog('📊 Android: Document hidden?', document.hidden);
                
                if (appOpened || document.hidden) {
                    debugLog('✅ Android: App opened!');
                    setStatus('✅ Opening GroupKart app...', 'success');
                } else {
                    debugLog('❌ Android: App not opened, redirecting to Play Store');
                    setStatus('📲 Redirecting to Play Store...', 'info');
                    
                    setTimeout(() => {
                        window.location.href = CONFIG.playStoreUrl;
                    }, 500);
                }
            }, CONFIG.appOpenTimeout);
        }

        // ====== TRY TO OPEN APP (iOS) ======
        function tryOpenIOSApp() {
            if (redirectAttempted) {
                debugLog('⚠️ iOS: Redirect already attempted');
                return;
            }
            
            redirectAttempted = true;
            sessionStorage.setItem(sessionKey, 'true');
            appOpened = false;
            
            debugLog('🍎 iOS: Starting app open attempt');
            setStatus('🔄 Attempting to open app...', 'info');
            
            const customScheme = buildCustomSchemeUri();
            
            // ✅ iOS: Use direct window.location (same as Android for consistency)
            debugLog('🍎 iOS: Trying direct window.location.href');
            window.location.href = customScheme;
            
            // Check if app opened
            setTimeout(() => {
                debugLog('⏱️ iOS: Wait complete', `${CONFIG.appOpenTimeout}ms`);
                debugLog('📊 iOS: App opened?', appOpened);
                debugLog('📊 iOS: Document hidden?', document.hidden);
                debugLog('📊 iOS: Document visibility', document.visibilityState);
                
                if (appOpened || document.hidden) {
                    debugLog('✅ iOS: App opened successfully!');
                    setStatus('✅ Opening GroupKart app...', 'success');
                } else {
                    debugLog('❌ iOS: App not opened, redirecting to App Store');
                    setStatus('📲 Redirecting to App Store...', 'info');
                    
                    setTimeout(() => {
                        debugLog('🏪 iOS: Opening App Store', CONFIG.appStoreUrl);
                        window.location.href = CONFIG.appStoreUrl;
                    }, 500);
                }
            }, CONFIG.appOpenTimeout);
        }

        // ====== BUTTON HANDLERS ======
        document.getElementById('androidBtn').addEventListener('click', (e) => {
            e.preventDefault();
            debugLog('🖱️ Android button clicked');
            
            if (isAndroid) {
                tryOpenAndroidApp();
            } else {
                debugLog('💻 Desktop: Opening Play Store');
                window.open(CONFIG.playStoreUrl, '_blank');
            }
        });

        document.getElementById('iosBtn').addEventListener('click', (e) => {
            e.preventDefault();
            debugLog('🖱️ iOS button clicked');
            
            if (isIOS) {
                tryOpenIOSApp();
            } else {
                debugLog('💻 Desktop: Opening App Store');
                window.open(CONFIG.appStoreUrl, '_blank');
            }
        });

        // ====== AUTO-OPEN ON MOBILE ======
        function autoOpen() {
            const hasDeepLink = !!(deepLinkData.cartId || deepLinkData.productId || deepLinkData.referCode);
            
            debugLog('🤔 Checking auto-open conditions', {
                isMobile: isMobile,
                isAndroid: isAndroid,
                isIOS: isIOS,
                redirectAttempted: redirectAttempted,
                hasDeepLink: hasDeepLink,
                sessionKey: sessionStorage.getItem(sessionKey)
            });
            
            // Skip if already attempted
            if (redirectAttempted) {
                debugLog('⏭️ Auto-open SKIPPED: Already attempted');
                setStatus('⚠️ Auto-open blocked. Clear session to retry.', 'error');
                document.getElementById('clearBtn').style.display = 'block';
                return;
            }
            
            // Skip if not mobile or no deep link
            if (!isMobile) {
                debugLog('⏭️ Auto-open SKIPPED: Not mobile device');
                return;
            }
            
            if (!hasDeepLink) {
                debugLog('⏭️ Auto-open SKIPPED: No deep link data');
                return;
            }
            
            debugLog('✅ Auto-open CONDITIONS MET');
            debugLog('🚀 Auto-opening app in 1 second...');
            setStatus('⏳ Auto-opening app...', 'info');
            
            setTimeout(() => {
                if (isAndroid) {
                    debugLog('🤖 Auto-opening: Android');
                    tryOpenAndroidApp();
                } else if (isIOS) {
                    debugLog('🍎 Auto-opening: iOS');
                    tryOpenIOSApp();
                }
            }, 1000);
        }

        // ====== INITIALIZE ======
        setupAppOpenDetection();
        updateUI();
        
        const willAutoOpen = isMobile && !redirectAttempted && !!(deepLinkData.cartId || deepLinkData.productId || deepLinkData.referCode);
        
        debugLog('🎯 Page Initialized', {
            dataSaved: dataSaved,
            redirectAttempted: redirectAttempted,
            willAutoOpen: willAutoOpen,
            sessionStorageValue: sessionStorage.getItem(sessionKey)
        });
        
        // Start auto-open
        autoOpen();
    </script>
</body>
</html>
