<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ✅ iOS Smart App Banner (Optional - Shows "Open in App" banner at top) -->
    <meta name="apple-itunes-app" content="app-id=6444329023">
    
    <title>GroupKart - Shop Together</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-android {
            background: #3DDC84;
            color: white;
        }
        
        .btn-ios {
            background: #000;
            color: white;
        }
        
        .info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            color: #555;
            font-size: 14px;
        }
        
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
        
        #status.show {
            display: block;
        }
        
        .status-info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .loader {
            display: none;
            margin: 20px auto;
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .loader.show {
            display: block;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .debug {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            font-size: 12px;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
            display: none; /* Hidden by default, enable for debugging */
        }
        
        .debug.show {
            display: block;
        }
        
        .debug-item {
            margin: 5px 0;
            padding: 5px;
            background: white;
            border-radius: 4px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛒</div>
        <h1>Welcome to GroupKart!</h1>
        <p id="mainText">Shop together effortlessly and get exclusive deals.</p>
        
        <div class="loader" id="loader"></div>
        <div id="status"></div>
        
        <div class="buttons" id="manualButtons" style="display: none;">
            <button id="androidBtn" class="btn btn-android">
                📱 Open in App / Download for Android
            </button>
            <button id="iosBtn" class="btn btn-ios">
                🍎 Open in App / Download for iOS
            </button>
        </div>
        
        <div class="info">
            <div class="info-item">✓ Fresh Indian sweets & snacks</div>
            <div class="info-item">✓ Delivered in 5-7 working days</div>
            <div class="info-item">✓ Shop together & save more</div>
        </div>
        
        <div id="debug" class="debug">
            <div style="font-weight: bold; margin-bottom: 10px;">🔍 Debug Information</div>
            <div id="debugContent"></div>
        </div>
    </div>

    <script>
        // ====== CONFIGURATION ======
        const DEBUG = false; // Set to true to see debug logs
        
        const CONFIG = {
            androidPackage: 'com.groupkart.store',
            iosAppId: '6444329023',
            playStoreUrl: 'https://play.google.com/store/apps/details?id=com.groupkart.store',
            appStoreUrl: 'https://apps.apple.com/us/app/groupkart/id6444329023',
            appOpenTimeout: 2500,
            autoRetryDelay: 3000, // Auto-clear session after 3 seconds
        };

        let redirectAttempted = false;
        let appOpened = false;
        let redirectTimer = null;
        
        const STORAGE_KEYS = {
            session: 'gk_session_v3',
            deepLink: 'groupkart_pending_deeplink',
            timestamp: 'gk_last_attempt',
        };

        // ====== DEBUG LOGGER ======
        function debugLog(message, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            console.log(`[${timestamp}] ${message}`, data || '');
            
            if (DEBUG) {
                const debugDiv = document.getElementById('debug');
                const debugContent = document.getElementById('debugContent');
                debugDiv.classList.add('show');
                
                let dataStr = '';
                if (data !== null && data !== undefined) {
                    if (typeof data === 'object') {
                        dataStr = '<br><pre style="margin:5px 0;font-size:11px;">' + JSON.stringify(data, null, 2) + '</pre>';
                    } else {
                        dataStr = ' → ' + data;
                    }
                }
                
                const logItem = document.createElement('div');
                logItem.className = 'debug-item';
                logItem.innerHTML = `<strong>[${timestamp}]</strong> ${message}${dataStr}`;
                debugContent.appendChild(logItem);
                debugContent.scrollTop = debugContent.scrollHeight;
            }
        }

        function setStatus(message, type = 'info', show = true) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status-${type}`;
            if (show) {
                statusDiv.classList.add('show');
            } else {
                statusDiv.classList.remove('show');
            }
        }

        function showLoader(show = true) {
            const loader = document.getElementById('loader');
            if (show) {
                loader.classList.add('show');
            } else {
                loader.classList.remove('show');
            }
        }

        function showManualButtons() {
            document.getElementById('manualButtons').style.display = 'flex';
            showLoader(false);
        }

        // ====== AUTO-CLEAR SESSION LOGIC ======
        function shouldClearSession() {
            const lastAttempt = sessionStorage.getItem(STORAGE_KEYS.timestamp);
            if (!lastAttempt) return false;
            
            const now = Date.now();
            const elapsed = now - parseInt(lastAttempt);
            
            // Auto-clear if more than 3 seconds since last attempt
            if (elapsed > CONFIG.autoRetryDelay) {
                debugLog('🔄 Auto-clearing old session', `${elapsed}ms elapsed`);
                return true;
            }
            
            return false;
        }

        function clearSession() {
            sessionStorage.removeItem(STORAGE_KEYS.session);
            sessionStorage.removeItem(STORAGE_KEYS.timestamp);
            redirectAttempted = false;
            debugLog('✅ Session cleared');
        }

        // Check and auto-clear if needed
        if (shouldClearSession()) {
            clearSession();
        }

        // Check if already attempted (within timeout window)
        const sessionAttempted = sessionStorage.getItem(STORAGE_KEYS.session);
        if (sessionAttempted === 'true') {
            const lastAttempt = sessionStorage.getItem(STORAGE_KEYS.timestamp);
            const elapsed = Date.now() - parseInt(lastAttempt || 0);
            
            if (elapsed < CONFIG.autoRetryDelay) {
                debugLog('⚠️ Recent redirect detected, waiting for auto-clear');
                redirectAttempted = true;
                
                // Auto-clear after delay
                setTimeout(() => {
                    debugLog('🔄 Auto-clearing session and reloading');
                    clearSession();
                    location.reload();
                }, CONFIG.autoRetryDelay - elapsed);
            } else {
                clearSession();
            }
        }

        // ====== PLATFORM DETECTION ======
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isMobile = isAndroid || isIOS;

        debugLog('🔍 Platform Detection', {
            isAndroid,
            isIOS,
            isMobile,
            userAgent: userAgent.substring(0, 100)
        });

        // ====== EXTRACT DEEP LINK DATA ======
        const urlParams = new URLSearchParams(window.location.search);
        const pathParts = window.location.pathname.split('/').filter(p => p);
        
        const deepLinkData = {
            type: pathParts[0] || 'home',
            cartId: urlParams.get('cart_id'),
            invitedUserId: urlParams.get('invited_user_id'),
            ownerName: urlParams.get('Owner_name'),
            productId: urlParams.get('id'),
            referCode: urlParams.get('refer') || (pathParts[0] === 'refer' ? pathParts[1] : null),
            index: urlParams.get('index') || '0',
            secPos: urlParams.get('secPos') || '0',
            list: urlParams.get('list') || 'false',
        };

        const hasDeepLink = !!(deepLinkData.cartId || deepLinkData.productId || deepLinkData.referCode);

        debugLog('📋 Deep Link Data', { hasDeepLink, ...deepLinkData });

        // ====== SAVE TO LOCALSTORAGE ======
        function saveDeepLinkData() {
            if (hasDeepLink) {
                const dataToSave = {
                    ...deepLinkData,
                    timestamp: Date.now(),
                    url: window.location.href,
                };
                
                try {
                    localStorage.setItem(STORAGE_KEYS.deepLink, JSON.stringify(dataToSave));
                    debugLog('💾 Saved to localStorage');
                    return true;
                } catch (e) {
                    debugLog('❌ LocalStorage error', e.message);
                    return false;
                }
            }
            return false;
        }

        saveDeepLinkData();

        // ====== UPDATE UI ======
        function updateUI() {
            const mainText = document.getElementById('mainText');
            
            if (deepLinkData.cartId) {
                mainText.innerHTML = `<strong>${deepLinkData.ownerName || 'A friend'}</strong> invited you to join their shopping cart!`;
                setStatus('📧 Cart invitation detected', 'success');
            } else if (deepLinkData.productId) {
                mainText.innerHTML = `Check out this awesome product!`;
                setStatus('🎁 Product link detected', 'success');
            } else if (deepLinkData.referCode) {
                mainText.innerHTML = `You've been invited to join GroupKart!<br><br><strong>Referral Code: ${deepLinkData.referCode}</strong>`;
                setStatus('🎉 Referral invitation detected', 'success');
            }
        }

        // ====== BUILD CUSTOM SCHEME URI ======
        function buildCustomSchemeUri() {
            let path = '';
            const params = [];
            
            if (deepLinkData.cartId) {
                path = 'cart';
                params.push(`cart_id=${deepLinkData.cartId}`);
                params.push(`invited_user_id=${deepLinkData.invitedUserId || ''}`);
                params.push(`Owner_name=${encodeURIComponent(deepLinkData.ownerName || '')}`);
            } else if (deepLinkData.productId) {
                path = 'product';
                params.push(`id=${deepLinkData.productId}`);
                params.push(`index=${deepLinkData.index}`);
                params.push(`secPos=${deepLinkData.secPos}`);
                params.push(`list=${deepLinkData.list}`);
            } else if (deepLinkData.referCode) {
                path = 'refer';
                params.push(`code=${deepLinkData.referCode}`);
            }
            
            const queryString = params.length > 0 ? '?' + params.join('&') : '';
            const uri = `groupkart://${path}${queryString}`;
            
            debugLog('🔗 Built URI', uri);
            return uri;
        }

        // ====== DETECT IF APP OPENED ======
        function setupAppOpenDetection() {
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    appOpened = true;
                    debugLog('✅ App opened (visibility)');
                    setStatus('✅ Opening GroupKart app...', 'success');
                    clearTimeout(redirectTimer);
                }
            });
            
            window.addEventListener('blur', () => {
                appOpened = true;
                debugLog('✅ App opened (blur)');
            });
            
            window.addEventListener('pagehide', () => {
                appOpened = true;
                debugLog('✅ App opened (pagehide)');
            });
        }

        // ====== TRY TO OPEN APP (UNIFIED) ======
        function tryOpenApp(platform) {
            if (redirectAttempted) {
                debugLog('⚠️ Redirect already attempted');
                return;
            }
            
            redirectAttempted = true;
            sessionStorage.setItem(STORAGE_KEYS.session, 'true');
            sessionStorage.setItem(STORAGE_KEYS.timestamp, Date.now().toString());
            
            appOpened = false;
            showLoader(true);
            setStatus('🔄 Opening app...', 'info');
            
            const customScheme = buildCustomSchemeUri();
            const storeUrl = platform === 'ios' ? CONFIG.appStoreUrl : CONFIG.playStoreUrl;
            
            debugLog(`🚀 ${platform}: Attempting to open app`);
            
            // Try to open app
            window.location.href = customScheme;
            
            // Wait and check if app opened
            redirectTimer = setTimeout(() => {
                debugLog(`⏱️ ${platform}: Timeout reached`);
                debugLog(`📊 App opened: ${appOpened}`);
                debugLog(`📊 Document hidden: ${document.hidden}`);
                
                if (appOpened || document.hidden) {
                    debugLog(`✅ ${platform}: App opened successfully`);
                    setStatus('✅ App opened!', 'success');
                } else {
                    debugLog(`❌ ${platform}: App not installed, opening store`);
                    setStatus('📲 Redirecting to store...', 'info');
                    
                    // Redirect to store after brief delay
                    setTimeout(() => {
                        window.location.href = storeUrl;
                    }, 500);
                }
            }, CONFIG.appOpenTimeout);
        }

        // ====== BUTTON HANDLERS ======
        document.getElementById('androidBtn').addEventListener('click', (e) => {
            e.preventDefault();
            debugLog('🖱️ Android button clicked');
            
            if (isAndroid) {
                tryOpenApp('android');
            } else {
                window.open(CONFIG.playStoreUrl, '_blank');
            }
        });

        document.getElementById('iosBtn').addEventListener('click', (e) => {
            e.preventDefault();
            debugLog('🖱️ iOS button clicked');
            
            if (isIOS) {
                tryOpenApp('ios');
            } else {
                window.open(CONFIG.appStoreUrl, '_blank');
            }
        });

        // ====== AUTO-OPEN ON MOBILE ======
        function autoOpen() {
            if (redirectAttempted) {
                debugLog('⏭️ Auto-open skipped: Already attempted');
                showManualButtons();
                return;
            }
            
            if (!isMobile) {
                debugLog('⏭️ Auto-open skipped: Desktop');
                showManualButtons();
                return;
            }
            
            if (!hasDeepLink) {
                debugLog('⏭️ Auto-open skipped: No deep link');
                showManualButtons();
                return;
            }
            
            debugLog('✅ Auto-opening app');
            setStatus('⏳ Opening app automatically...', 'info');
            showLoader(true);
            
            // Small delay to ensure page is ready
            setTimeout(() => {
                if (isAndroid) {
                    tryOpenApp('android');
                } else if (isIOS) {
                    tryOpenApp('ios');
                }
            }, 500); // Reduced delay for smoother UX
        }

        // ====== INITIALIZE ======
        setupAppOpenDetection();
        updateUI();
        
        debugLog('🎯 Initialized', {
            hasDeepLink,
            willAutoOpen: isMobile && !redirectAttempted && hasDeepLink,
            redirectAttempted
        });
        
        // Start auto-open
        autoOpen();
    </script>
</body>
</html>
