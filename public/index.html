<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroupKart - Shop Together</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-android {
            background: #3DDC84;
            color: white;
        }
        
        .btn-ios {
            background: #000;
            color: white;
        }
        
        .info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            color: #555;
            font-size: 14px;
        }
        
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .status-info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .debug {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            font-size: 12px;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        
        .debug.show {
            display: block;
        }
        
        .debug-item {
            margin: 5px 0;
            padding: 5px;
            background: white;
            border-radius: 4px;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛒</div>
        <h1>Welcome to GroupKart!</h1>
        <p id="mainText">Shop together effortlessly and get exclusive deals.</p>
        
        <div id="status"></div>
        
        <div class="buttons">
            <button id="androidBtn" class="btn btn-android">
                📱 Open in App / Download for Android
            </button>
            <button id="iosBtn" class="btn btn-ios">
                🍎 Open in App / Download for iOS
            </button>
        </div>
        
        <div class="info">
            <div class="info-item">✓ Fresh Indian sweets & snacks</div>
            <div class="info-item">✓ Delivered in 5-7 working days</div>
            <div class="info-item">✓ Shop together & save more</div>
        </div>
        
        <div id="debug" class="debug">
            <div style="font-weight: bold; margin-bottom: 10px;">🔍 Debug Information</div>
            <div id="debugContent"></div>
        </div>
    </div>

    <script>
        // ====== CONFIGURATION ======
        const DEBUG = true; // Set to false in production
        
        const CONFIG = {
            androidPackage: 'com.groupkart.store',
            iosAppId: '6444329023',
            playStoreUrl: 'https://play.google.com/store/apps/details?id=com.groupkart.store',
            appStoreUrl: 'https://apps.apple.com/us/app/groupkart/id6444329023',
            appOpenTimeout: 2500, // Time to wait for app to open
        };

        let redirectAttempted = false;
        let appOpened = false;

        // ====== DEBUG LOGGER ======
        function debugLog(message, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            console.log(`[${timestamp}] ${message}`, data || '');
            
            if (DEBUG) {
                const debugDiv = document.getElementById('debug');
                const debugContent = document.getElementById('debugContent');
                debugDiv.classList.add('show');
                
                const logItem = document.createElement('div');
                logItem.className = 'debug-item';
                logItem.innerHTML = `<strong>[${timestamp}]</strong> ${message}${data ? '<br><pre>' + JSON.stringify(data, null, 2) + '</pre>' : ''}`;
                debugContent.appendChild(logItem);
                debugContent.scrollTop = debugContent.scrollHeight;
            }
        }

        function setStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status-${type}`;
        }

        // ====== PLATFORM DETECTION ======
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isMobile = isAndroid || isIOS;

        debugLog('Platform detected', {
            userAgent: userAgent.substring(0, 100),
            isAndroid: isAndroid,
            isIOS: isIOS,
            isMobile: isMobile
        });

        // ====== EXTRACT DEEP LINK DATA ======
        const urlParams = new URLSearchParams(window.location.search);
        const pathParts = window.location.pathname.split('/').filter(p => p);
        
        const deepLinkData = {
            type: pathParts[0] || 'home',
            cartId: urlParams.get('cart_id'),
            invitedUserId: urlParams.get('invited_user_id'),
            ownerName: urlParams.get('Owner_name'),
            productId: urlParams.get('id'),
            referCode: urlParams.get('refer') || (pathParts[0] === 'refer' ? pathParts[1] : null),
            index: urlParams.get('index') || '0',
            secPos: urlParams.get('secPos') || '0',
            list: urlParams.get('list') || 'false',
        };

        debugLog('Deep link data extracted', deepLinkData);

        // ====== SAVE TO LOCALSTORAGE ======
        function saveDeepLinkData() {
            if (deepLinkData.cartId || deepLinkData.productId || deepLinkData.referCode) {
                const dataToSave = {
                    ...deepLinkData,
                    timestamp: Date.now(),
                    url: window.location.href,
                };
                
                try {
                    localStorage.setItem('groupkart_pending_deeplink', JSON.stringify(dataToSave));
                    debugLog('Data saved to localStorage', dataToSave);
                    return true;
                } catch (e) {
                    debugLog('Error saving data', e.message);
                    return false;
                }
            }
            return false;
        }

        saveDeepLinkData();

        // ====== UPDATE UI ======
        function updateUI() {
            const mainText = document.getElementById('mainText');
            
            if (deepLinkData.cartId) {
                mainText.innerHTML = `<strong>${deepLinkData.ownerName || 'A friend'}</strong> invited you to join their shopping cart!<br><br><small>Cart ID: ${deepLinkData.cartId}</small>`;
                setStatus('📧 Cart invitation detected', 'success');
            } else if (deepLinkData.productId) {
                mainText.innerHTML = `Check out this awesome product!<br><br><small>Product ID: ${deepLinkData.productId}</small>`;
                setStatus('🎁 Product link detected', 'success');
            } else if (deepLinkData.referCode) {
                mainText.innerHTML = `You've been invited to join GroupKart!<br><br><strong>Referral Code: ${deepLinkData.referCode}</strong>`;
                setStatus('🎉 Referral invitation detected', 'success');
            }
        }

        // ====== BUILD CUSTOM SCHEME URI ======
        function buildCustomSchemeUri() {
            let path = '';
            const params = [];
            
            if (deepLinkData.cartId) {
                path = 'cart';
                params.push(`cart_id=${deepLinkData.cartId}`);
                params.push(`invited_user_id=${deepLinkData.invitedUserId || ''}`);
                params.push(`Owner_name=${encodeURIComponent(deepLinkData.ownerName || '')}`);
            } else if (deepLinkData.productId) {
                path = 'product';
                params.push(`id=${deepLinkData.productId}`);
                params.push(`index=${deepLinkData.index}`);
                params.push(`secPos=${deepLinkData.secPos}`);
                params.push(`list=${deepLinkData.list}`);
            } else if (deepLinkData.referCode) {
                path = 'refer';
                params.push(`code=${deepLinkData.referCode}`);
            }
            
            const queryString = params.length > 0 ? '?' + params.join('&') : '';
            return `groupkart://${path}${queryString}`;
        }

        // ====== DETECT IF APP OPENED ======
        function setupAppOpenDetection() {
            // Method 1: Visibility change
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    appOpened = true;
                    debugLog('✅ App opened (visibility changed)');
                    setStatus('✅ Opening GroupKart app...', 'success');
                }
            });
            
            // Method 2: Page blur
            window.addEventListener('blur', () => {
                appOpened = true;
                debugLog('✅ App opened (window blur)');
            });
            
            // Method 3: Page focus (when returning)
            window.addEventListener('focus', () => {
                if (appOpened) {
                    debugLog('ℹ️ User returned to browser');
                }
            });
        }

        // ====== TRY TO OPEN APP (ANDROID) ======
        function tryOpenAndroidApp() {
            if (redirectAttempted) {
                debugLog('⚠️ Redirect already attempted');
                return;
            }
            
            redirectAttempted = true;
            appOpened = false;
            
            debugLog('🚀 Android: Starting app open attempt');
            setStatus('🔄 Attempting to open app...', 'info');
            
            const customScheme = buildCustomSchemeUri();
            const startTime = Date.now();
            
            debugLog('📱 Trying custom scheme', customScheme);
            
            // Try to open app
            window.location.href = customScheme;
            
            // Wait and check if app opened
            setTimeout(() => {
                const elapsed = Date.now() - startTime;
                
                debugLog('⏱️ Time elapsed', `${elapsed}ms`);
                debugLog('📊 App opened status', appOpened);
                debugLog('📊 Document hidden', document.hidden);
                
                if (appOpened || document.hidden) {
                    debugLog('✅ App opened successfully!');
                    setStatus('✅ Opening GroupKart app...', 'success');
                } else {
                    debugLog('❌ App not installed, redirecting to Play Store');
                    setStatus('📲 Redirecting to Play Store...', 'info');
                    
                    // Small delay to ensure smooth transition
                    setTimeout(() => {
                        debugLog('🏪 Opening Play Store', CONFIG.playStoreUrl);
                        window.location.href = CONFIG.playStoreUrl;
                    }, 500);
                }
            }, CONFIG.appOpenTimeout);
        }

        // ====== TRY TO OPEN APP (iOS) ======
        function tryOpenIOSApp() {
            if (redirectAttempted) {
                debugLog('⚠️ Redirect already attempted');
                return;
            }
            
            redirectAttempted = true;
            appOpened = false;
            
            debugLog('🍎 iOS: Starting app open attempt');
            setStatus('🔄 Attempting to open app...', 'info');
            
            const universalLink = window.location.href;
            debugLog('📱 Trying Universal Link', universalLink);
            
            // Try Universal Link
            window.location.href = universalLink;
            
            // Fallback to App Store
            setTimeout(() => {
                if (!appOpened && !document.hidden) {
                    debugLog('❌ App not installed, redirecting to App Store');
                    setStatus('📲 Redirecting to App Store...', 'info');
                    
                    setTimeout(() => {
                        debugLog('🏪 Opening App Store', CONFIG.appStoreUrl);
                        window.location.href = CONFIG.appStoreUrl;
                    }, 500);
                } else {
                    debugLog('✅ App opened successfully!');
                }
            }, CONFIG.appOpenTimeout);
        }

        // ====== BUTTON HANDLERS ======
        document.getElementById('androidBtn').addEventListener('click', (e) => {
            e.preventDefault();
            debugLog('🖱️ Android button clicked');
            
            if (isAndroid) {
                tryOpenAndroidApp();
            } else {
                debugLog('💻 Desktop: Opening Play Store in new tab');
                window.open(CONFIG.playStoreUrl, '_blank');
            }
        });

        document.getElementById('iosBtn').addEventListener('click', (e) => {
            e.preventDefault();
            debugLog('🖱️ iOS button clicked');
            
            if (isIOS) {
                tryOpenIOSApp();
            } else {
                debugLog('💻 Desktop: Opening App Store in new tab');
                window.open(CONFIG.appStoreUrl, '_blank');
            }
        });

        // ====== AUTO-OPEN ON MOBILE ======
        function autoOpen() {
            // Only auto-open if there's deep link data
            if (!isMobile || (!deepLinkData.cartId && !deepLinkData.productId && !deepLinkData.referCode)) {
                debugLog('ℹ️ Auto-open skipped', {
                    isMobile: isMobile,
                    hasDeepLink: !!(deepLinkData.cartId || deepLinkData.productId || deepLinkData.referCode)
                });
                return;
            }
            
            debugLog('🤖 Auto-opening app in 1 second...');
            setStatus('⏳ Auto-opening app...', 'info');
            
            setTimeout(() => {
                if (isAndroid) {
                    debugLog('🤖 Auto-clicking Android button');
                    tryOpenAndroidApp();
                } else if (isIOS) {
                    debugLog('🤖 Auto-clicking iOS button');
                    tryOpenIOSApp();
                }
            }, 1000);
        }

        // ====== INITIALIZE ======
        setupAppOpenDetection();
        updateUI();
        autoOpen();
        
        debugLog('🎯 Page initialized', {
            dataSaved: !!localStorage.getItem('groupkart_pending_deeplink'),
            willAutoOpen: isMobile && !!(deepLinkData.cartId || deepLinkData.productId || deepLinkData.referCode)
        });
    </script>
</body>
</html>
